<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Binary Search Birthday</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

body{
background:#0b0f14;
color:#e6edf3;
font-family:Inter,system-ui;
margin:0;
padding:14px;
}

.app{
max-width:950px;
margin:auto;
}

.header{
background:#11161d;
border-radius:14px;
padding:18px;
margin-bottom:12px;
border:1px solid rgba(255,255,255,.05);
position:sticky;
top:10px;
z-index:10;
}

.question{
font-size:18px;
font-weight:500;
}

.controls{
margin-top:12px;
display:flex;
gap:10px;
}

.btn-yes{
background:#7aa2f7;
border:none;
flex:1;
font-weight:500;
}

.btn-no{
background:#1f2732;
border:none;
color:#e6edf3;
flex:1;
}

.btn-replay{
background:#1f6feb;
border:none;
margin-top:10px;
width:100%;
}

.btn-yes:hover{ background:#6b92e2; }
.btn-no:hover{ background:#273243; }

.result{
margin-top:8px;
font-weight:500;
}

.step{
font-size:12px;
color:#8b949e;
margin-top:4px;
}

/* CALENDAR */

.calendar{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
gap:10px;
}

.month{
background:#11161d;
border-radius:10px;
padding:8px;
border:1px solid rgba(255,255,255,.04);
}

.month-name{
font-size:12px;
text-align:center;
margin-bottom:6px;
color:#9aa4af;
}

.days{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:2px;
}

.day{
font-size:10px;
text-align:center;
padding:3px 0;
border-radius:3px;
background:#1f2732;
transition:.25s ease;
}

/* STATES */

.active{
background:#2c3746;
}

.mid{
background:#7aa2f7;
color:#000;
font-weight:600;
transform:scale(1.15);
}

.rejected{
background:#0f1318;
color:#37414d;
}

</style>
</head>


<body>

<div class="app">

<div class="header">

<div id="question" class="question"></div>

<div class="controls" id="controls">

<button class="btn btn-yes" onclick="answer(true)">Yes</button>

<button class="btn btn-no" onclick="answer(false)">No</button>

</div>

<div id="step" class="step"></div>

<div id="result" class="result"></div>

<div id="replayContainer"></div>

</div>

<div id="calendar" class="calendar"></div>

</div>


<script>

/* DATA */

const months=[
"Jan","Feb","Mar","Apr","May","Jun",
"Jul","Aug","Sep","Oct","Nov","Dec"
]

const daysInMonth=[31,28,31,30,31,30,31,31,30,31,30,31]

/* BUILD CALENDAR */

let dayCounter=1
const calendar=document.getElementById("calendar")

for(let m=0;m<12;m++){

let monthDiv=document.createElement("div")
monthDiv.className="month"

let title=document.createElement("div")
title.className="month-name"
title.innerText=months[m]

let days=document.createElement("div")
days.className="days"

for(let d=1;d<=daysInMonth[m];d++){

let cell=document.createElement("div")
cell.className="day"
cell.id="d"+dayCounter
cell.innerText=d

days.appendChild(cell)

dayCounter++

}

monthDiv.appendChild(title)
monthDiv.appendChild(days)
calendar.appendChild(monthDiv)

}

/* DATE CONVERSION */

function dayToDate(day){

let m=0

while(day>daysInMonth[m]){

day-=daysInMonth[m]
m++

}

return months[m]+" "+day

}

/* BINARY SEARCH STATE */

let low
let high
let mid
let step

const maxSteps=Math.ceil(Math.log2(365))

function reset(){

low=1
high=365
step=1

document.getElementById("result").innerText=""
document.getElementById("replayContainer").innerHTML=""

document.getElementById("controls").style.display="flex"

render()

}

/* RENDER */

function render(){

mid=Math.floor((low+high)/2)

for(let i=1;i<=365;i++){

let cell=document.getElementById("d"+i)

cell.classList.remove("active","mid","rejected")

if(i<low || i>high){

cell.classList.add("rejected")

}else{

cell.classList.add("active")

}

if(i===mid){

cell.classList.add("mid")

}

}

document.getElementById("question").innerText=
"Is your birthday after "+dayToDate(mid)+"?"

document.getElementById("step").innerText=
"Step "+step+" of "+maxSteps

}

/* ANSWER HANDLER */

function answer(yes){

if(low===high) return

if(yes){
low=mid+1
}else{
high=mid
}

step++

render()

if(low===high){

document.getElementById("result").innerText=
"Birthday found: "+dayToDate(low)

document.getElementById("controls").style.display="none"

showReplay()

}

}

/* REPLAY BUTTON */

function showReplay(){

const btn=document.createElement("button")

btn.className="btn btn-replay"

btn.innerText="Play Again"

btn.onclick=reset

document.getElementById("replayContainer").appendChild(btn)

}

/* INITIAL START */

reset()

</script>

</body>
</html>
