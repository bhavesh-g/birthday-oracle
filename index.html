<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Birthday Oracle</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body{
background:#0c0f14;
font-family:Inter, Roboto, system-ui;
color:#e6edf3;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.container-box{
max-width:520px;
}

.game-card{

background:#11161d;

border-radius:20px;

padding:48px;

box-shadow:0 40px 80px rgba(0,0,0,.55);

border:1px solid rgba(255,255,255,.04);

transition:.3s ease;

}

.title{
font-size:28px;
font-weight:600;
letter-spacing:.3px;
}

.subtitle{
color:#9aa4af;
margin-top:8px;
margin-bottom:35px;
}

.question{
font-size:22px;
font-weight:500;
min-height:70px;
}

.btn-yes{
background:#7aa2f7;
border:none;
padding:12px 26px;
font-weight:500;
}

.btn-yes:hover{
background:#6d92df;
}

.btn-no{
background:#1e2630;
border:none;
color:#d4dce5;
padding:12px 26px;
font-weight:500;
}

.btn-no:hover{
background:#283140;
}

.buttons{
margin-top:25px;
display:flex;
gap:16px;
}

.result{
font-size:26px;
margin-top:30px;
font-weight:500;
}

.progress{
height:6px;
background:#1c222b;
margin-top:30px;
}

.progress-bar{
background:#7aa2f7;
transition:width .4s ease;
}

.fade{
opacity:.6;
transform:scale(.98);
}

</style>
</head>

<body>

<div class="container container-box">

<div id="card" class="game-card">

<div class="title">Birthday Oracle</div>

<div class="subtitle">
Answer a few simple yes or no questions.
</div>

<div id="question" class="question"></div>

<div id="buttons" class="buttons">

<button class="btn btn-yes" onclick="answer(true)">Yes</button>

<button class="btn btn-no" onclick="answer(false)">No</button>

</div>

<div id="result" class="result"></div>

<div class="progress">

<div id="bar" class="progress-bar"></div>

</div>

</div>

</div>

<script>

const daysInMonth=[31,28,31,30,31,30,31,31,30,31,30,31]

const months=[
"January","February","March","April","May","June",
"July","August","September","October","November","December"
]

function dayToDate(day){

let m=0

while(day>daysInMonth[m]){
day-=daysInMonth[m]
m++
}

return months[m]+" "+day

}


/* Binary search state */

let low=1
let high=365
let mid
let steps=0
const maxSteps=Math.ceil(Math.log2(365))


function animate(){

const card=document.getElementById("card")

card.classList.add("fade")

setTimeout(()=>card.classList.remove("fade"),120)

}


function ask(){

if(low===high){

showResult()

return

}

mid=Math.floor((low+high)/2)

document.getElementById("question").innerText=

"Is your birthday after "+dayToDate(mid)+"?"

}


function answer(yes){

animate()

steps++

if(yes){
low=mid+1
}else{
high=mid
}

updateProgress()

ask()

}


function updateProgress(){

let pct=(steps/maxSteps)*100

document.getElementById("bar").style.width=pct+"%"

}


function showResult(){

document.getElementById("question").innerText="Your birthday is"

document.getElementById("buttons").innerHTML=""

document.getElementById("result").innerText=dayToDate(low)

let btn=document.createElement("button")

btn.className="btn btn-yes mt-3"

btn.innerText="Play Again"

btn.onclick=restart

document.getElementById("buttons").appendChild(btn)

}


/* restart */

function restart(){

low=1
high=365
steps=0

document.getElementById("result").innerText=""

document.getElementById("buttons").innerHTML=

`<button class="btn btn-yes" onclick="answer(true)">Yes</button>
<button class="btn btn-no" onclick="answer(false)">No</button>`

updateProgress()

ask()

}


/* binary search correctness test */

function test(){

for(let day=1;day<=365;day++){

let l=1
let h=365

while(l<h){

let m=Math.floor((l+h)/2)

if(day>m){
l=m+1
}else{
h=m
}

}

if(l!==day){

console.error("logic failure",day)

return

}

}

console.log("Binary search validated for all 365 days")

}

test()

ask()

</script>

</body>
</html>
